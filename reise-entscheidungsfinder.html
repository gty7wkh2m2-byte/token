<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: obere Leiste mit Reise und Reitern, darunter eine einspaltige Arbeitsfläche; Tabellen scrollen in eigenen Containern. */
:root{
  --bg:#f1f6f5; --surf:#ffffff; --surf2:#e5efed; --line:#bcd2cd; --fg:#10312d; --fg2:#4a6a65;
  --acc:#0b7a6c; --acc-fg:#ffffff;
  --ok:#14805c; --warn:#a56a00; --bad:#c23a39; --info:#4a46b8; --copy:#1f6fbf; --file:#14805c;
  --okbg:#e3f4ed; --warnbg:#fbf0d9; --badbg:#fbe4e3; --infobg:#e8e7f8; --copybg:#e3eefa;
  --sh:0 1px 3px rgba(16,49,45,.14);
  --f-sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'DM Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08221f; --surf:#0d302c; --surf2:#123b36; --line:#1f524b; --fg:#e8f3f1; --fg2:#9fbdb8;
  --acc:#2fb5a3; --acc-fg:#06201c;
  --ok:#3fcf9f; --warn:#f0b24a; --bad:#f2706f; --info:#9a95f0; --copy:#6db0f2; --file:#3fcf9f;
  --okbg:#10382f; --warnbg:#3a2f12; --badbg:#401d1d; --infobg:#26244d; --copybg:#12304a;
  --sh:0 1px 4px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08221f; --surf:#0d302c; --surf2:#123b36; --line:#1f524b; --fg:#e8f3f1; --fg2:#9fbdb8;
  --acc:#2fb5a3; --acc-fg:#06201c;
  --ok:#3fcf9f; --warn:#f0b24a; --bad:#f2706f; --info:#9a95f0; --copy:#6db0f2; --file:#3fcf9f;
  --okbg:#10382f; --warnbg:#3a2f12; --badbg:#401d1d; --infobg:#26244d; --copybg:#12304a;
  --sh:0 1px 4px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-sans);padding-inline:16px;padding-block:0 80px}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:20px;margin:0}
h2{font-size:19px;margin:22px 0 4px;text-wrap:balance}
h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--fg2);font-size:13px;margin:0 0 8px}
.mono{font-family:var(--f-mono)}
#app{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.hrow h1{flex:1 1 220px;min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--fg2);white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:700}
nav.tabs button:hover{color:var(--fg)}
:focus-visible{outline:3px solid var(--info);outline-offset:1px}
.btn{display:inline-block;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:14px;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
.btn.cp{border-color:var(--copy);color:var(--copy);background:var(--copybg)}
.btn.fl{border-color:var(--file);color:var(--file);background:var(--okbg);font-family:var(--f-mono);font-size:13px}
.btn.dg{border-color:var(--bad);color:var(--bad)}
a.btn{color:var(--info);border-color:var(--info)}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0;max-width:100%}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--sh);min-width:0}
.card.stripe{border-left:5px solid var(--c,var(--acc))}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.flds{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--fg2);min-width:0}
.fld input,.fld select{width:100%;color:var(--fg);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--c,var(--line));color:var(--c,var(--fg2));background:var(--cb,transparent);margin:0 4px 4px 0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.p-ok{--c:var(--ok);--cb:var(--okbg)}.p-warn{--c:var(--warn);--cb:var(--warnbg)}.p-bad{--c:var(--bad);--cb:var(--badbg)}.p-info{--c:var(--info);--cb:var(--infobg)}.p-cp{--c:var(--copy);--cb:var(--copybg)}
.kpis{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:10px 0}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--fg2)}
.prog{height:8px;background:var(--surf2);border-radius:6px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--ok)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surf2);font-size:12px;letter-spacing:.3px;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--surf2)}
tr.best td{background:var(--okbg)}
.note{border-left:5px solid var(--c,var(--warn));background:var(--cb,var(--warnbg));padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13.5px}
.note.n-ok{--c:var(--ok);--cb:var(--okbg)}.note.n-bad{--c:var(--bad);--cb:var(--badbg)}.note.n-info{--c:var(--info);--cb:var(--infobg)}
.todo{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.todo .tx{flex:1;min-width:0}
.todo.done .tx{text-decoration:line-through;color:var(--fg2)}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);background:none;cursor:pointer;flex:none;color:#fff;font-weight:700;line-height:1;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.auto{cursor:default;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
.oc{border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:10px;background:var(--surf);margin:10px 0;padding:8px 12px}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fh b{flex:1;min-width:150px}
.vals td input[type=number]{width:70px}
.cell{width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surf);cursor:pointer;padding:0}
.cell.d{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.x{background:var(--surf2);color:var(--fg2)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs2 .btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13.5px;max-width:90vw}
.cbx{border:2px solid var(--copy);border-radius:8px;background:var(--surf);margin:6px 0}
.cbx .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;background:var(--copybg);font-size:13px;flex-wrap:wrap}
.cbx pre{margin:0;padding:8px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.45 var(--f-mono)}
.tg{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--warn);color:var(--bg);border-radius:4px;padding:0 6px;margin-left:6px}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:10px;padding:8px 10px;margin:6px 0}
.step .no{font:700 12px var(--f-mono);background:var(--c,var(--acc));color:var(--acc-fg);border-radius:50%;min-width:24px;height:24px;display:grid;place-items:center;flex:none}
.step .bd{flex:1;min-width:0}
/* Prioritätsliste */
.cr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--c,var(--info));border-radius:8px;padding:6px 8px;margin:6px 0}
.cr.must{--c:var(--bad)}.cr.soft{--c:var(--warn)}.cr.off{opacity:.5}
.cr.drag{opacity:.35}.cr.over{outline:3px dashed var(--acc)}
.cr .nm{flex:1 1 220px;min-width:0;font-weight:700}
.grip{cursor:grab;font-size:20px;color:var(--fg2);user-select:none;line-height:1}
.rk{font:700 13px var(--f-mono);background:var(--surf2);border-radius:6px;padding:1px 7px}
.cv{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;cursor:pointer;background:var(--surf);color:var(--fg2)}
.cv.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.mu{border:1px solid var(--c);color:var(--c);background:var(--cb);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer;font-weight:700}
.mu.m{--c:var(--bad);--cb:var(--badbg)}.mu.w{--c:var(--warn);--cb:var(--warnbg)}
.tgl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--fg2)}
.cvs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-left:34px}
@media (max-width:560px){.hrow h1{flex-basis:100%}.cvs{padding-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function optSat(o,l,c,t){
  if(c.id==='maxstops'){var ms=num(l.maxStops),st=num(o.stops);if(ms==null)return 1;if(st==null)return 2;return st<=ms?1:0}

function legsView(t,i,s){

  for(var k=i;k<i+s;k++){var m=num(t.legs[k].maxStops);if(m==null)open=true;else ms+=m}
  return {id:a.id+'+'+b.id,from:a.from,to:b.to,date:a.date,depWin:a.depWin,arrWin:b.arrWin,maxStops:open?'':String(ms+s-1),imp:a.imp,span:s};

function bstat(h,k,lim){if(!lim)return '?';if(h==null&&k==null)return '?';if(k!=null&&k<=lim)return 'under';if(h!=null&&h>lim)return 'over';if(h!=null&&h<=lim&&(k==null||k>lim))return k==null?'?':'part';return '?'}
function rank(t,p){

  var lim=num(t.budget.amount),n=t.legs.length,cons=p.cons.filter(function(c){return c.on}),softs=cons.filter(function(c){return !c.must});
  var per=t.legs.map(function(l,i){return (t.opts[l.id]||[]).map(function(o){var s=Math.max(1,+o.span||1);if(i+s>n)s=1;return {o:o,i:i,s:s,l:legsView(t,i,s),pr:price(o)}})});
  per.forEach(function(info){
    var ok=info.filter(function(x){return x.pr!=null}).map(function(x){return x.pr}),mn=Math.min.apply(null,ok),mx=Math.max.apply(null,ok);
    info.forEach(function(x){

      optF.forEach(function(f){var w=effW(p,f);if(!w)return;var u;
        if(f.kind==='num'){if(x.pr==null){u=50;gaps.push('Preis')}else u=(!ok.length||mx===mn)?100:100*(mx-x.pr)/(mx-mn)}
        else{var k=val(x.o,x.l,f);u=effU(p,f,k);if(k==='?')gaps.push(f.name)}
        s+=w*u;sw+=w});
      x.sc=sw?s/sw:0;x.gaps=gaps;x.sat={};x.mf=[];x.wf=[];x.pre=0;
      cons.forEach(function(c){var r=optSat(x.o,x.l,c,t);if(r===null)return;x.sat[c.id]=r;if(r===0)(c.must?x.mf:x.wf).push(c.id)});
      var run=true;softs.forEach(function(c){if(x.sat[c.id]===undefined)return;if(run&&x.sat[c.id]!==0)x.pre++;else run=false});
    });
  });
  var prod=per.reduce(function(a,b){return a*Math.max(1,b.length)},1),capped=false;
  var use=per.map(function(a){if(prod>5000){capped=true;return a.slice().sort(function(x,y){return (x.mf.length?1:0)-(y.mf.length?1:0)||y.pre-x.pre||(x.pr==null?1e9:x.pr)-(y.pr==null?1e9:y.pr)}).slice(0,10)}return a});
  var missing=[];t.legs.forEach(function(l,i){if(!use[i].length)missing.push(i)});
  function rec(i){if(i>=n)return [[]];if(!use[i].length)return rec(i+1);var out=[];use[i].forEach(function(x){rec(i+x.s).forEach(function(tl){out.push([x].concat(tl))})});return out}
  var res=rec(0).filter(function(c){return c.length}).map(function(c){
    var ih=0,ik=0,hOk=true,kOk=true,dur=0,dOk=true,imp=0,sm=0,gp=0;
    c.forEach(function(x){var h=num(x.o.priceHand),k=num(x.o.priceHold),a=num(x.o.access)||0;if(h==null)hOk=false;else ih+=h+a;if(k==null)kOk=false;else ik+=k+a;
      var d=durMin(x.o,x.l);if(d==null)dOk=false;else dur+=d;var w=num(x.l.imp);w=w==null?1:w;imp+=w;sm+=w*x.sc;gp+=x.gaps.length});

    for(var j=0;j<c.length-1;j++){
      var a=c[j],b=c[j+1],ua=utc(a.o,a.l,'a'),ub=utc(b.o,b.l,'d'),same=!!(a.o.group&&a.o.group===b.o.group);
      if(ua==null||ub==null){gapU++;selfU++;conn.push(null);continue}
      var g=Math.round((ub-ua)/6e4),rq=same?(num(t.gapSame)==null?60:num(t.gapSame)):(num(t.gapSep)==null?120:num(t.gapSep));
      conn.push({g:g,rq:rq,same:same});if(g<rq)gapF++;if(!same&&g<1440)selfF++;

      else{var z=0,u=0;c.forEach(function(x){var q=x.sat[cn.id];if(q===0)z++;else if(q===2)u++});r=z?0:u?2:1}

    var groups={};c.forEach(function(x){groups[x.o.group||x.o.id]=1});var nb=Object.keys(groups).length;
    var bk=bstat(ih,ik,lim);

    var cs={k_bookings:String(Math.min(nb,4)),k_budget:bk},sw=p.A!=null?+p.A:10,sum=sw*(imp?sm/imp:0);
    cmbF.forEach(function(f){var w=effW(p,f);if(!w)return;sum+=w*effU(p,f,cs[f.id]);sw+=w});

  });

  var fresh=real&&t.legs.every(function(l){return (t.opts[l.id]||[]).every(function(o){return DER.p_age(o)==='6h'||DER.p_age(o)==='24h'})});

    ['a1','Etappen mit Datum, Flughäfen und Zeitfenstern definiert',t.legs.length>0&&t.legs.every(function(l){return l.from&&l.to&&l.date}),true],
    ['a2','Budgetregel festgelegt (Preis minimieren oder Betrag)',t.budget.basis==='min'||num(t.budget.amount)>0,true],
    ['a3','Zahlweg festgelegt',!!t.pay,true],

    ['a5','Mindestens 2 Optionen je Etappe',t.legs.every(function(l){return (t.opts[l.id]||[]).length>=2}),true],

    ['m3','Zeitzonen der Flughäfen geprüft (Tabelle in Tab 7)',!!t.chk.m3,false],
    ['m4','Anreise zu den Abflughäfen geplant (Zeit, Kosten)',!!t.chk.m4,false],
    ['m5','Feste Termine und Unterkunft mit den Flugzeiten abgestimmt',!!t.chk.m5,false],

function hints(t,days){

  if(t.url)h+='<div class="note n-info">Bezugspunkt Kiwi-Link: Zeitfenster, Stopps und Gepäck sind <b>interpretiert als</b> Abflug von–bis und Ankunft von–bis je Etappe (Gruppen getrennt durch "_"), maximale Stopps je Etappe und Gepäckparameter "'+esc((/bags=([^&]*)/.exec(t.url)||[])[1]||'')+'" (gelesen als 1 Handgepäck + 1 Aufgabegepäck).</div>';

function suggest(t){
  var cat=CAT(),p=P(),all=[];t.legs.forEach(function(l,i){(t.opts[l.id]||[]).forEach(function(o){all.push([o,legsView(t,i,Math.max(1,+o.span||1))])})});
  var out=[];
  if(!all.length)out.push(['info','Noch keine Optionen. Analyse der Datenlücken startet nach dem ersten Import.']);
  else{
    var gaps={};all.forEach(function(x){cat.forEach(function(f){if(f.kind==='cmb'||f.kind==='num')return;var used=effW(p,f)>0||p.cons.some(function(c){return c.on&&c.id==='f:'+f.id});if(used&&val(x[0],x[1],f)==='?')gaps[f.name]=(gaps[f.name]||0)+1})});
    Object.keys(gaps).sort(function(a,b){return gaps[b]-gaps[a]}).slice(0,6).forEach(function(k){out.push(['warn','"'+k+'" fehlt bei '+gaps[k]+' von '+all.length+' Optionen. Quelle ergänzen oder Gewicht und Nebenbedingung entfernen; unbekannt zählt als erfüllt.'])});
    var old=all.filter(function(x){return DER.p_age(x[0],x[1])==='old'||DER.p_age(x[0],x[1])==='?'}).length;
    if(old)out.push(['warn',old+' Optionen ohne frischen Preisstand (älter als 72 h oder ohne Abrufzeit).']);
  }
  var wins={};S.profiles.forEach(function(q){var r=rank(t,q).res.filter(function(x){return !x.mf.length})[0];if(r)wins[r.key]=1});
  if(Object.keys(wins).length>1)out.push(['warn','Die Profile liefern verschiedene Gewinner. Die Entscheidung hängt von Ziel und Prioritäten ab (Tab 6, Gewinner je Profil).']);
  else if(Object.keys(wins).length===1)out.push(['ok','Alle Profile führen zum selben Gewinner (robustes Ergebnis).']);
  out.push(['info','Workflow: Sobald dieselbe Abfrage zum dritten Mal läuft, als Skill oder geplante Aufgabe anlegen. JSON-Import (Tab 5) ist die Schnittstelle für Unteragenten.']);
  return out.map(function(x){return '<div class="note '+(x[0]==='ok'?'n-ok':x[0]==='info'?'n-info':'')+'">'+esc(x[1])+'</div>'}).join('');
}

var TABS={start:tabStart,quellen:tabQuellen,prio:tabPrio,merk:tabMerk,opt:tabOpt,ent:tabEnt,daten:tabDaten};
function render(){
  var y=window.scrollY;
  $('#app').innerHTML=head()+'<main>'+TABS[S.tab]()+'</main>';
  window.scrollTo(0,y);
}

/* ---------- Ereignisse ---------- */
function findOpt(t,l,id){return (t.opts[l]||[]).filter(function(o){return o.id===id})[0]}
function setB(b,v,el){
  var t=T(),p=b.split(':'),k=p[0];
  if(k==='cur'){S.cur=v;S.legTab=null;S.det=null;return 'r'}
  if(k==='prof'){S.prof=v;S.pdel=false;return 'r'}
  if(k==='showviol'){S.showViol=el.checked;return 'r'}
  if(k==='t'){t[p[1]]=v;return 'r'}
  if(k==='bud'){t.budget[p[1]]=v;return 'r'}
  if(k==='pf'){P()[p[1]]=v;return 'r'}
  if(k==='con'){P().cons[+p[1]].on=el.checked;return 'r'}
  if(k==='l'){var l=t.legs.filter(function(x){return x.id===p[1]})[0],f=p[2];
    if(f==='dw0')l.depWin[0]=+v;else if(f==='dw1')l.depWin[1]=+v;else if(f==='aw0')l.arrWin[0]=+v;else if(f==='aw1')l.arrWin[1]=+v;else l[f]=(f==='from'||f==='to')?v.toUpperCase():v;return 'r'}
  if(k==='o'){var o=findOpt(t,p[1],p[2]),f2=p.slice(3).join(':');
    if(f2.indexOf('f.')===0){o.f=o.f||{};o.f[f2.slice(2)]=v}else o[f2]=(f2==='depAp'||f2==='arrAp')?v.toUpperCase():v;
    return f2==='span'?'r':'o:'+o.id+':'+p[1]}
  if(k==='w'){P().w[p[1]]=+v;logEv('Gewicht '+p[1]+' = '+v+' (Profil '+P().name+')');return 'r'}
  if(k==='u'){var pr=P();pr.u[p[1]]=pr.u[p[1]]||{};pr.u[p[1]][p[2]]=+v;return 'r'}
  if(k==='s'){var s=t.src.filter(function(x){return x.id===p[1]})[0];s[p[2]]=v;return 'n'}
  return 'n';
}
function moveCons(a,b){var arr=P().cons;if(b<0||b>=arr.length||a===b)return;var it=arr.splice(a,1)[0];arr.splice(b,0,it);logEv('Priorität geändert: '+consShort(it)+' auf Platz '+(b+1));save();render()}
function act(a,el){
  var t=T(),v=el.getAttribute('data-v'),ci=+el.getAttribute('data-i');
  switch(a){
    case 'tab':S.tab=v;break;
    case 'copy':copyTxt(el.getAttribute('data-t'));return;
    case 'newtrip':S.tab='start';render();var k=$('#kiwiurl');if(k){k.scrollIntoView();k.focus()}return;
    case 'kiwi':var r=parseKiwi($('#kiwiurl').value);if(!r){toast('Link nicht lesbar: erwartet kiwi.com/.../multicity/results/...');return}
      var nt=newTrip('Neue Reise '+fmtDate(r.legs[0].date)+' bis '+fmtDate(r.legs[r.legs.length-1].date),r.legs,$('#kiwiurl').value.trim());S.trips.push(nt);S.cur=nt.id;logEv('Reise aus Kiwi-Link angelegt: '+r.legs.length+' Etappen');toast('Reise angelegt');break;
    case 'addleg':t.legs.push({id:uid('l'),from:'',to:'',date:'',depWin:[0,24],arrWin:[0,24],maxStops:'',imp:'1'});break;
    case 'dleg':t.legs=t.legs.filter(function(l){return l.id!==v});delete t.opts[v];break;
    case 'chk':t.chk[v]=!t.chk[v];break;
    case 'st':var s=t.src.filter(function(x){return x.id===el.getAttribute('data-s')})[0],kk=el.getAttribute('data-k'),c=s.st[kk];s.st[kk]=!c?nowIso():c==='x'?'':'x';break;
    case 'addsrc':t.src.push({id:uid('s'),name:'Neue Quelle',url:'',st:{}});break;
    case 'dsrc':t.src=t.src.filter(function(x){return x.id!==v});break;
    case 'legtab':S.legTab=v;break;
    case 'addopt':var lg=t.legs.filter(function(l){return l.id===v})[0];(t.opts[v]=t.opts[v]||[]).push({id:uid('o_'),date:lg.date,depAp:lg.from,arrAp:lg.to,dep:'',arr:'',plus:0,stops:'',lay:'',dur:'',priceHand:'',priceHold:'',access:'',group:'',span:'1',source:'',url:'',retrieved:nowIso(),flightno:'',fare:'',note:'',f:{}});break;
    case 'dupopt':var L=el.getAttribute('data-l'),src=findOpt(t,L,v),cp=JSON.parse(JSON.stringify(src));cp.id=uid('o_');t.opts[L].push(cp);break;
    case 'dopt':var L2=el.getAttribute('data-l');t.opts[L2]=t.opts[L2].filter(function(o){return o.id!==v});break;
    case 'now':findOpt(t,el.getAttribute('data-l'),v).retrieved=nowIso();break;
    case 'impopt':try{var arr=JSON.parse($('#impjson').value);if(!Array.isArray(arr))arr=[arr];var n=0;arr.forEach(function(x){var l=t.legs[(+x.leg||1)-1];if(!l)return;delete x.leg;x.id=uid('o_');x.f=x.f||{};(t.opts[l.id]=t.opts[l.id]||[]).push(x);n++});logEv(n+' Optionen importiert');toast(n+' Optionen importiert')}catch(e){toast('JSON nicht lesbar: '+e.message);return}break;
    case 'det':S.det=S.det===v?null:v;break;
    case 'dupprof':var pp=P(),c2=JSON.parse(JSON.stringify(pp));c2.id=uid('p_');c2.name=pp.name+' (Kopie)';S.profiles.push(c2);S.prof=c2.id;logEv('Profil dupliziert: '+pp.name);break;
    case 'resetprof':var base=defaultProfiles(),cur=P(),bi=base.filter(function(b){return b.id===cur.id})[0]||base[0];cur.w=JSON.parse(JSON.stringify(bi.w));cur.u={};cur.cons=JSON.parse(JSON.stringify(bi.cons));cur.obj=bi.obj;logEv('Profil zurückgesetzt: '+cur.name);break;
    case 'pfdel':S.pdel=true;break;
    case 'pfdel2':var del=S.prof;S.profiles=S.profiles.filter(function(x){return x.id!==del});S.prof=S.profiles[0].id;S.pdel=false;logEv('Profil gelöscht');break;
    case 'cmust':var cc=P().cons[ci];cc.must=!cc.must;logEv('Bedingung '+consShort(cc)+': '+(cc.must?'Muss':'Wunsch'));break;
    case 'cmove':moveCons(ci,ci+(+el.getAttribute('data-d')));return;
    case 'cdel':var rm=P().cons.splice(ci,1)[0];logEv('Nebenbedingung entfernt: '+consShort(rm));break;
    case 'callow':var c3=P().cons[ci],kq=el.getAttribute('data-k');c3.allowed=c3.allowed||[];var ix=c3.allowed.indexOf(kq);if(ix>=0)c3.allowed.splice(ix,1);else c3.allowed.push(kq);break;
    case 'addcon':var id=$('#addcon').value;if(!id)return;var nc={id:id,on:true,must:false};if(id.indexOf('f:')===0){var f0=catById(id.slice(2));nc.allowed=f0.vals.filter(function(x){return x.k!=='?'&&x.u>=60}).map(function(x){return x.k})}P().cons.push(nc);logEv('Nebenbedingung hinzugefügt: '+consShort(nc));break;
    case 'addfeat':var nm=$('#nf_name').value.trim(),vs=$('#nf_vals').value.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){var q=l.split('|');return {k:'v'+i,l:q[0],u:num(q[1])==null?50:num(q[1])}});
      if(!nm||vs.length<2){toast('Name und mindestens 2 Ausprägungen nötig');return}
      S.custom.push({id:uid('x_'),name:nm,grp:$('#nf_grp').value,w:+$('#nf_w').value||0,vals:vs});logEv('Eigenes Merkmal: '+nm);toast('Merkmal angelegt');break;
    case 'dcust':S.custom=S.custom.filter(function(c){return c.id!==v});break;
    case 'cpjson':copyTxt(JSON.stringify(S),'JSON kopiert');return;
    case 'dl':download();return;
    case 'impall':try{var j=JSON.parse($('#impall').value);if(!j.trips)throw new Error('Feld trips fehlt');S=j;save();logEv('Gesamt-JSON übernommen');toast('Übernommen')}catch(e){toast('JSON nicht lesbar: '+e.message);return}break;
    case 'reset':S.rst=true;break;
    case 'reset2':try{localStorage.removeItem(LS)}catch(e){}load();toast('Auslieferungsstand geladen');break;
    case 'tzsave':var tz={};$('#tzbox').value.split('\n').forEach(function(l){var q=l.split('=');if(q.length===2&&q[0].trim()){var x=q[1].trim();tz[q[0].trim().toUpperCase()]=x.toUpperCase()==='EU'?'EU':+x}});S.tz=tz;logEv('Zeitzonen gespeichert');toast('Gespeichert');break;
    case 'fb':var tx=$('#fbtx').value.trim();if(!tx)return;S.fb.unshift({t:nowIso(),x:tx});logEv('Feedback eingetragen');break;
  }
  save();render();
}
function download(){
  var emb=JSON.stringify(S).replace(/<\//g,'<\\/');
  var html=SRC.replace(/(<script type="application\/json" id="EMBEDDED_DATA">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+'\n'+emb+'\n'+b});
  try{var d=nowIso().replace('T','_').replace(':','');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='reise-entscheidungsfinder_'+d+'.html';document.body.appendChild(a);a.click();a.remove();toast('Download gestartet (in der Artefakt-Ansicht blockiert: JSON kopieren)')}catch(e){toast('Download nicht möglich: JSON kopieren')}
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||!$('#app').contains(el))return;act(el.getAttribute('data-a'),el)});
document.addEventListener('input',function(e){var el=e.target;if(el.hasAttribute&&el.hasAttribute('data-live')){var o=document.getElementById(el.getAttribute('data-live'));if(o)o.textContent=el.value}});
document.addEventListener('change',function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-b');if(!b)return;
  var r=setB(b,el.type==='checkbox'?el.checked:el.value,el);save();
  if(r==='r')render();
  else if(r&&r.indexOf('o:')===0){var q=r.split(':'),t=T(),l=t.legs.filter(function(x){return x.id===q[2]})[0],o=findOpt(t,q[2],q[1]),c=document.getElementById('oc-'+q[1]);if(c&&o){var idx=t.legs.indexOf(l);c.querySelector('.der').innerHTML=derStrip(o,legsView(t,idx,Math.max(1,+o.span||1)))}}
});
/* Drag und Drop der Prioritätsliste */
var dragI=null;
document.addEventListener('dragstart',function(e){var r=e.target.closest&&e.target.closest('.cr');if(!r)return;dragI=+r.getAttribute('data-i');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragI))}catch(x){}r.classList.add('drag')});
document.addEventListener('dragover',function(e){var r=e.target.closest&&e.target.closest('.cr');if(!r||dragI==null)return;e.preventDefault();document.querySelectorAll('.cr.over').forEach(function(x){x.classList.remove('over')});r.classList.add('over')});
document.addEventListener('drop',function(e){var r=e.target.closest&&e.target.closest('.cr');if(!r||dragI==null)return;e.preventDefault();var to=+r.getAttribute('data-i'),from=dragI;dragI=null;moveCons(from,to)});
document.addEventListener('dragend',function(){dragI=null;document.querySelectorAll('.cr.drag,.cr.over').forEach(function(x){x.classList.remove('drag');x.classList.remove('over')})});
load();render();
})();
</script>
