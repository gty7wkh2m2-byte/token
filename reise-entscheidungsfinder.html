:root{

}

  --okbg:#10382f; --warnbg:#3a2f12; --badbg:#401d1d; --infobg:#26244d; --copybg:#12304a;
  --sh:0 1px 4px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08221f; --surf:#0d302c; --surf2:#123b36; --line:#1f524b; --fg:#e8f3f1; --fg2:#9fbdb8;
  --acc:#2fb5a3; --acc-fg:#06201c;
  --ok:#3fcf9f; --warn:#f0b24a; --bad:#f2706f; --info:#9a95f0; --copy:#6db0f2; --file:#3fcf9f;
  --okbg:#10382f; --warnbg:#3a2f12; --badbg:#401d1d; --infobg:#26244d; --copybg:#12304a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-sans);padding-inline:16px;padding-block:0 80px}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:20px;margin:0}
h2{font-size:19px;margin:22px 0 4px;text-wrap:balance}
h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--fg2);font-size:13px;margin:0 0 8px}
.mono{font-family:var(--f-mono)}
#app{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.hrow h1{flex:1 1 220px;min-width:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--fg2);white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:700}
nav.tabs button:hover{color:var(--fg)}
:focus-visible{outline:3px solid var(--info);outline-offset:1px}
.btn{display:inline-block;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:14px;color:var(--fg)}
.btn:hover{border-color:var(--acc)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
.btn.cp{border-color:var(--copy);color:var(--copy);background:var(--copybg)}
.btn.fl{border-color:var(--file);color:var(--file);background:var(--okbg);font-family:var(--f-mono);font-size:13px}

.grid.w2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.flds{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--fg2);min-width:0}
.fld input,.fld select{width:100%;color:var(--fg);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--c,var(--line));color:var(--c,var(--fg2));background:var(--cb,transparent);margin:0 4px 4px 0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.p-ok{--c:var(--ok);--cb:var(--okbg)}.p-warn{--c:var(--warn);--cb:var(--warnbg)}.p-bad{--c:var(--bad);--cb:var(--badbg)}.p-info{--c:var(--info);--cb:var(--infobg)}.p-cp{--c:var(--copy);--cb:var(--copybg)}

.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--fg2)}
.prog{height:8px;background:var(--surf2);border-radius:6px;overflow:hidden;margin-top:4px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surf2);font-size:12px;letter-spacing:.3px;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--surf2)}
tr.best td{background:var(--okbg)}
.note{border-left:5px solid var(--c,var(--warn));background:var(--cb,var(--warnbg));padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13.5px}
.note.n-ok{--c:var(--ok);--cb:var(--okbg)}.note.n-bad{--c:var(--bad);--cb:var(--badbg)}.note.n-info{--c:var(--info);--cb:var(--infobg)}
.todo{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.todo .tx{flex:1;min-width:0}
.todo.done .tx{text-decoration:line-through;color:var(--fg2)}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);background:none;cursor:pointer;flex:none;color:#fff;font-weight:700;line-height:1;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.auto{cursor:default;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
.oc{border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:10px;background:var(--surf);margin:10px 0;padding:8px 12px}
.oc.bad{--c:var(--bad)}.oc.ex{--c:var(--warn)}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fh b{flex:1;min-width:150px}
.vals td input[type=number]{width:70px}
.cell{width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surf);cursor:pointer;padding:0}
.cell.d{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.x{background:var(--surf2);color:var(--fg2)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs2 .btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13.5px;max-width:90vw}
.cbx{border:2px solid var(--copy);border-radius:8px;background:var(--surf);margin:6px 0}
.cbx .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;background:var(--copybg);font-size:13px;flex-wrap:wrap}
.cbx pre{margin:0;padding:8px;max-height:170px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.45 var(--f-mono)}
.tg{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--warn);color:var(--bg);border-radius:4px;padding:0 6px;margin-left:6px}
@media (max-width:560px){.hrow h1{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function tm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null}

function tzOff(ap,locMs){var t=S.tz[ap];if(t===undefined)return null;if(t==='EU'){var y=new Date(locMs).getUTCFullYear();var a=Date.UTC(y,2,lastSun(y,2),2),b=Date.UTC(y,9,lastSun(y,9),3);return locMs>=a&&locMs<b?2:1}return +t}
function dUTC(ds){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ds||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function addDays(ds,n){var d=new Date(dUTC(ds)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function durMin(o,l){

  var o1=tzOff(o.depAp||l.from,l1),o2=tzOff(o.arrAp||l.to,l2);if(o1==null||o2==null)return null;
  return Math.round(((l2-o2*36e5)-(l1-o1*36e5))/6e4);
}

var DER={

  z_nextday:function(o){return tm(o.arr)==null?'?':(+o.plus>0?'next':'same')},
  z_window:function(o,l){var a=tm(o.dep),b=tm(o.arr);if(a==null||b==null)return '?';var dw=l.depWin||[0,24],aw=l.arrWin||[0,24];
    var okD=a>=dw[0]*60&&a<=dw[1]*60,okA=(+o.plus||0)===0&&b>=aw[0]*60&&b<=aw[1]*60;return okD&&okA?'in':'out'},
  z_dateshift:function(o,l){var a=dUTC(o.date||l.date),b=dUTC(l.date);if(a==null||b==null)return '?';var n=Math.abs(Math.round((a-b)/864e5));return n===0?'p':n===1?'1':n===2?'2':'f'},
  z_stops:function(o){var s=num(o.stops);return s==null?'?':s===0?'0':s===1?'1':'2'},
  z_layover:function(o){var s=num(o.stops);if(s===0)return 'na';var m=num(o.lay);if(s==null||m==null)return '?';return m<60?'lt60':m<90?'60':m<240?'90':m<480?'240':'long'},
  p_age:function(o){if(!o.retrieved)return '?';var t=Date.parse(o.retrieved);if(isNaN(t))return '?';var h=(Date.now()-t)/36e5;return h<6?'6h':h<24?'24h':h<72?'72h':'old'},

function val(o,l,f){if(f.kind==='der')return DER[f.id](o,l);var v=(o.f||{})[f.id];return v==null||v===''?(f.def||'?'):v}
function effW(p,f){var v=p.w[f.id];return v!=null?+v:f.w}
function effU(p,f,k){var m=p.u[f.id];if(m&&m[k]!=null)return +m[k];var v=f.vals.filter(function(x){return x.k===k})[0];return v?v.u:50}
function isX(p,f,k){return !!(p.x[f.id]&&p.x[f.id].indexOf(k)>=0)}

/* ---------- Bewertung und Rangliste ---------- */
function bstat(h,k,lim){if(!lim)return '?';if(h==null&&k==null)return '?';if(k!=null&&k<=lim)return 'under';if(h!=null&&h>lim)return 'over';if(h!=null&&h<=lim&&(k==null||k>lim))return k==null?'?':'part';return '?'}
function rank(t,p){
  var cat=CAT(),optF=cat.filter(function(f){return f.kind!=='cmb'}),cmbF=cat.filter(function(f){return f.kind==='cmb'});
  var lim=num(t.budget.amount);
  var per=t.legs.map(function(l){
    var info=(t.opts[l.id]||[]).map(function(o){return {o:o,l:l,v:viol(o,l,p,t),pr:price(o)}});
    var ok=info.filter(function(x){return !x.v.length&&x.pr!=null}).map(function(x){return x.pr});
    var mn=Math.min.apply(null,ok),mx=Math.max.apply(null,ok);
    info.forEach(function(x){
      var sw=0,s=0,gaps=[];
      optF.forEach(function(f){var w=effW(p,f);if(!w)return;var u;
        if(f.kind==='num'){if(x.pr==null){u=50;gaps.push('Preis')}else u=(!ok.length||mx===mn)?100:100*(mx-x.pr)/(mx-mn)}
        else{var k=val(x.o,l,f);u=effU(p,f,k);if(k==='?')gaps.push(f.name)}
        s+=w*u;sw+=w});
      x.sc=sw?s/sw:0;x.gaps=gaps;
    });
    return info;
  });
  var capped=false;var prod=per.reduce(function(a,b){return a*Math.max(1,b.length)},1);
  var use=per.map(function(a){if(prod>5000){capped=true;return a.slice().sort(function(x,y){return y.sc-x.sc}).slice(0,10)}return a});
  var combos=[[]];
  use.forEach(function(a){var nx=[];if(!a.length){combos=[];return}combos.forEach(function(c){a.forEach(function(x){nx.push(c.concat([x]))})});combos=nx});
  var res=combos.map(function(c){
    var ih=c.reduce(function(a,x){return a===null||num(x.o.priceHand)==null?null:a+num(x.o.priceHand)+(num(x.o.access)||0)},0);
    var ik=c.reduce(function(a,x){return a===null||num(x.o.priceHold)==null?null:a+num(x.o.priceHold)+(num(x.o.access)||0)},0);
    var imp=0,sm=0;c.forEach(function(x){var w=num(x.l.imp);w=w==null?1:w;imp+=w;sm+=w*x.sc});
    var avg=imp?sm/imp:0;
    var groups={};c.forEach(function(x){groups[x.o.group||x.o.id]=1});var nb=Object.keys(groups).length;
    var rs=bstat(ih,ik,lim);
    var ts=c.map(function(x){return bstat(num(x.o.priceHand)==null?null:num(x.o.priceHand)+(num(x.o.access)||0),num(x.o.priceHold)==null?null:num(x.o.priceHold)+(num(x.o.access)||0),lim)});
    var ticket=ts.indexOf('over')>=0?'over':ts.indexOf('part')>=0?'part':ts.indexOf('?')>=0?'?':'under';
    var bk=t.budget.basis==='ticket'?ticket:rs;
    var cs={k_bookings:String(Math.min(nb,4)),k_budget:bk},sw=p.A!=null?+p.A:10,sum=sw*avg,gaps=0;
    cmbF.forEach(function(f){var w=effW(p,f);if(!w)return;sum+=w*effU(p,f,cs[f.id]);sw+=w});
    var v=[];c.forEach(function(x){x.v.forEach(function(r){v.push(r)})});
    c.forEach(function(x){gaps+=x.gaps.length});
    var tot=t.bagMode==='hand'?ih:ik;
    return {c:c,ih:ih,ik:ik,tot:tot,score:sw?sum/sw:0,nb:nb,rs:rs,ticket:ticket,bk:bk,viol:v,gaps:gaps,key:c.map(function(x){return x.o.id}).join('+')};
  });
  var el=res.filter(function(r){return !r.viol.length&&r.tot!=null});
  el.forEach(function(r){r.par=!el.some(function(q){return q!==r&&q.tot<=r.tot&&q.score>=r.score&&(q.tot<r.tot||q.score>r.score)})});
  res.sort(function(a,b){return (a.viol.length?1:0)-(b.viol.length?1:0)||b.score-a.score});
  return {per:per,res:res,capped:capped,prod:prod};
}

function tabEnt(){

  cat.forEach(function(f){h+='<tr><td>'+esc(f.name)+'</td><td class="n">'+effW(p,f)+'</td>'+r.c.map(function(x){var k=val(x.o,x.l,f);return '<td>'+esc(lab(f,k))+' <span class="mono sub">'+effU(p,f,k)+'</span></td>'}).join('')+'</tr>'});
  h+='<tr><td><b>Etappenwert</b></td><td></td>'+r.c.map(function(x){return '<td><b>'+Math.round(x.sc)+'</b></td>'}).join('')+'</tr></table></div>';
  if(r.viol.length)h+='<div class="note n-bad">'+r.viol.map(esc).join('; ')+'</div>';
  return h;
}

/* Tab 6 */
function tabDaten(){
  var t=T(),H='<h2>Daten und Lernen</h2>';
  H+='<h3>Sicherung und Übernahme</h3><div class="card"><div class="hrow"><button class="btn cp" data-a="cpjson">Alles als JSON kopieren</button><button class="btn fl" data-a="dl">Datei laden: reise-entscheidungsfinder_'+nowIso().replace('T','_').replace(':','')+'.html</button></div><p class="sub">Der Datei-Download ist in der Artefakt-Ansicht blockiert. Dort JSON kopieren und lokal speichern. In der lokalen HTML-Datei funktioniert der Download.</p><textarea id="impall" rows="4" placeholder="Gesamt-JSON hier einfügen"></textarea><div class="hrow" style="margin-top:6px"><button class="btn" data-a="impall">JSON übernehmen (ersetzt alles)</button><button class="btn dg" data-a="'+(S.rst?'reset2':'reset')+'">'+(S.rst?'Wirklich zurücksetzen?':'Auf Auslieferungsstand zurücksetzen')+'</button></div></div>';
  H+='<h3>Zeitzonen der Flughäfen</h3><div class="card"><p class="sub">Je Zeile CODE=EU oder CODE=Versatz in Stunden (UTC). EU = Sommerzeit nach EU-Regel. Unbekannte Flughäfen: Dauer manuell eintragen.</p><textarea id="tzbox" rows="5">'+esc(Object.keys(S.tz).map(function(k){return k+'='+S.tz[k]}).join('\n'))+'</textarea><div class="hrow" style="margin-top:6px"><button class="btn" data-a="tzsave">Zeitzonen speichern</button></div></div>';
  H+='<h3>Verbesserungsvorschläge aus deinen Daten</h3>'+suggest(t);
  H+='<h3>Feedback an das Werkzeug</h3><div class="card"><textarea id="fbtx" rows="3" placeholder="Was fehlt, was stört, welches Merkmal soll dazu?"></textarea><div class="hrow" style="margin-top:6px"><button class="btn" data-a="fb">Eintragen</button></div>'+S.fb.map(function(x){return '<div class="todo"><span class="mono sub">'+esc(x.t)+'</span><span class="tx">'+esc(x.x)+'</span></div>'}).join('')+'</div>';
  H+='<h3>Lernprotokoll</h3><div class="card">'+(S.log.length?S.log.slice(0,40).map(function(x){return '<div class="todo"><span class="mono sub">'+esc(x.t)+'</span><span class="tx">'+esc(x.x)+'</span></div>'}).join(''):'<span class="sub">Noch keine Einträge.</span>')+'</div>';
  H+='<h3>Version</h3><div class="note n-info">V0.1 Vorbereitungs-Dashboard, Stand 09.10.2026. Neu in V0.1: Merkmalskatalog mit '+CAT().length+' Merkmalen, 4 Profile, Optionen-Erfassung, Rangliste mit Sensitivität. Das Werkzeug lernt nicht selbstständig; Verbesserungen entstehen nur über die hier dokumentierten Regeln, Gewichte und Feedback-Einträge.</div>';
  return H;
}
function suggest(t){
  var cat=CAT(),p=P(),all=[];t.legs.forEach(function(l){(t.opts[l.id]||[]).filter(function(o){return !o.ex}).forEach(function(o){all.push([o,l])})});
  var out=[];
  if(!all.length)out.push(['info','Noch keine echten Optionen. Analyse der Datenlücken startet nach dem ersten Import.']);
  else{
    var gaps={};all.forEach(function(x){cat.forEach(function(f){if(f.kind==='cmb'||f.kind==='num')return;if(effW(p,f)>0&&val(x[0],x[1],f)==='?')gaps[f.name]=(gaps[f.name]||0)+1})});
    Object.keys(gaps).sort(function(a,b){return gaps[b]-gaps[a]}).slice(0,5).forEach(function(k){out.push(['warn','"'+k+'" fehlt bei '+gaps[k]+' von '+all.length+' Optionen. Quelle ergänzen oder Gewicht auf 0 setzen, sonst zählt der Neutralwert 50.'])});
    var old=all.filter(function(x){return DER.p_age(x[0],x[1])==='old'||DER.p_age(x[0],x[1])==='?'}).length;
    if(old)out.push(['warn',old+' Optionen ohne frischen Preisstand (älter als 72 h oder ohne Abrufzeit).']);
  }
  var w=cat.filter(function(f){return effW(p,f)===0}).length;out.push(['info',w+' Merkmale haben im Profil "'+p.name+'" Gewicht 0 und beeinflussen die Rangfolge nicht.']);
  var wins={};S.profiles.forEach(function(q){var r=rank(t,q).res.filter(function(x){return !x.viol.length})[0];if(r)wins[r.key]=1});
  if(Object.keys(wins).length>1)out.push(['warn','Die Profile liefern verschiedene Gewinner. Die Entscheidung hängt von der Gewichtung ab (Tab 5, Sensitivität).']);
  else if(Object.keys(wins).length===1)out.push(['ok','Alle Profile führen zum selben Gewinner (robustes Ergebnis).']);
  out.push(['info','Workflow: Sobald dieselbe Abfrage zum dritten Mal läuft, als Skill oder geplante Aufgabe anlegen. JSON-Import (Tab 4) ist dafür die Schnittstelle für Unteragenten.']);
  return out.map(function(x){return '<div class="note '+(x[0]==='ok'?'n-ok':x[0]==='info'?'n-info':'')+'">'+esc(x[1])+'</div>'}).join('');
}

var TABS={start:tabStart,quellen:tabQuellen,merk:tabMerk,opt:tabOpt,ent:tabEnt,daten:tabDaten};
function render(){
  var y=window.scrollY;
  $('#app').innerHTML=head()+'<main>'+TABS[S.tab]()+'</main>';
  window.scrollTo(0,y);
}

/* ---------- Ereignisse ---------- */
function findOpt(t,l,id){return (t.opts[l]||[]).filter(function(o){return o.id===id})[0]}
function setB(b,v,el){
  var t=T(),p=b.split(':'),k=p[0];
  if(k==='cur'){S.cur=v;S.legTab=null;S.det=null;return 'r'}
  if(k==='prof'){S.prof=v;return 'r'}
  if(k==='showviol'){S.showViol=el.checked;return 'r'}
  if(k==='t'){t[p[1]]=v;if(p[1]==='bagMode'||p[1]==='pay')return 'r';return 'r'}
  if(k==='bud'){t.budget[p[1]]=v;return 'r'}
  if(k==='l'){var l=t.legs.filter(function(x){return x.id===p[1]})[0],f=p[2];
    if(f==='dw0')l.depWin[0]=+v;else if(f==='dw1')l.depWin[1]=+v;else if(f==='aw0')l.arrWin[0]=+v;else if(f==='aw1')l.arrWin[1]=+v;else l[f]=(f==='from'||f==='to')?v.toUpperCase():v;return 'r'}
  if(k==='o'){var o=findOpt(t,p[1],p[2]),f=p.slice(3).join(':');
    if(f.indexOf('f.')===0){o.f=o.f||{};o.f[f.slice(2)]=v}else o[f]=(f==='depAp'||f==='arrAp')?v.toUpperCase():v;
    if(o.ex&&f!=='note')o.ex=o.ex;return 'o:'+o.id+':'+p[1]}
  if(k==='w'){P().w[p[1]]=+v;logEv('Gewicht '+p[1]+' = '+v+' (Profil '+P().name+')');return 'r'}
  if(k==='u'){var pr=P();pr.u[p[1]]=pr.u[p[1]]||{};pr.u[p[1]][p[2]]=+v;return 'r'}
  if(k==='x'){var pr2=P();pr2.x[p[1]]=pr2.x[p[1]]||[];var i=pr2.x[p[1]].indexOf(p[2]);if(el.checked&&i<0)pr2.x[p[1]].push(p[2]);if(!el.checked&&i>=0)pr2.x[p[1]].splice(i,1);return 'r'}
  if(k==='s'){var s=t.src.filter(function(x){return x.id===p[1]})[0];s[p[2]]=v;return 'n'}
  return 'n';
}
function act(a,el){
  var t=T(),v=el.getAttribute('data-v');
  switch(a){
    case 'tab':S.tab=v;break;
    case 'copy':copyTxt(el.getAttribute('data-t'));return;
    case 'newtrip':S.tab='start';render();var k=$('#kiwiurl');if(k){k.scrollIntoView();k.focus()}return;
    case 'kiwi':var r=parseKiwi($('#kiwiurl').value);if(!r){toast('Link nicht lesbar: erwartet kiwi.com/.../multicity/results/...');return}
      var nt=newTrip('Neue Reise '+fmtDate(r.legs[0].date)+' bis '+fmtDate(r.legs[r.legs.length-1].date),r.legs,$('#kiwiurl').value.trim());S.trips.push(nt);S.cur=nt.id;logEv('Reise aus Kiwi-Link angelegt: '+r.legs.length+' Etappen');toast('Reise angelegt');break;
    case 'addleg':t.legs.push({id:uid('l'),from:'',to:'',date:'',depWin:[0,24],arrWin:[0,24],maxStops:'',imp:'1'});break;
    case 'dleg':t.legs=t.legs.filter(function(l){return l.id!==v});delete t.opts[v];break;
    case 'chk':t.chk[v]=!t.chk[v];break;
    case 'st':var s=t.src.filter(function(x){return x.id===el.getAttribute('data-s')})[0],kk=el.getAttribute('data-k'),c=s.st[kk];s.st[kk]=!c?nowIso():c==='x'?'':'x';if(c&&c!=='x')s.st[kk]='x';break;
    case 'addsrc':t.src.push({id:uid('s'),name:'Neue Quelle',url:'',st:{}});break;
    case 'dsrc':t.src=t.src.filter(function(x){return x.id!==v});break;
    case 'legtab':S.legTab=v;break;
    case 'addopt':(t.opts[v]=t.opts[v]||[]).push({id:uid('o_'),date:(t.legs.filter(function(l){return l.id===v})[0]||{}).date,depAp:(t.legs.filter(function(l){return l.id===v})[0]||{}).from,arrAp:(t.legs.filter(function(l){return l.id===v})[0]||{}).to,dep:'',arr:'',plus:0,stops:'',lay:'',dur:'',priceHand:'',priceHold:'',access:'',group:'',source:'',url:'',retrieved:nowIso(),flightno:'',note:'',f:{}});break;
    case 'dupopt':var L=el.getAttribute('data-l'),src=findOpt(t,L,v),cp=JSON.parse(JSON.stringify(src));cp.id=uid('o_');t.opts[L].push(cp);break;
    case 'dopt':var L2=el.getAttribute('data-l');t.opts[L2]=t.opts[L2].filter(function(o){return o.id!==v});break;
    case 'now':findOpt(t,el.getAttribute('data-l'),v).retrieved=nowIso();break;
    case 'rmdemo':t.legs.forEach(function(l){t.opts[l.id]=(t.opts[l.id]||[]).filter(function(o){return !o.ex})});logEv('Beispieloptionen entfernt');break;
    case 'impopt':try{var arr=JSON.parse($('#impjson').value);if(!Array.isArray(arr))arr=[arr];var n=0;arr.forEach(function(x){var l=t.legs[(+x.leg||1)-1];if(!l)return;delete x.leg;x.id=uid('o_');x.f=x.f||{};(t.opts[l.id]=t.opts[l.id]||[]).push(x);n++});logEv(n+' Optionen importiert');toast(n+' Optionen importiert')}catch(e){toast('JSON nicht lesbar: '+e.message);return}break;
    case 'det':S.det=S.det===v?null:v;break;
    case 'dupprof':var pp=P(),c2=JSON.parse(JSON.stringify(pp));c2.id=uid('p_');c2.name=pp.name+' (Kopie)';S.profiles.push(c2);S.prof=c2.id;logEv('Profil dupliziert: '+pp.name);break;
    case 'resetprof':var base=defaultProfiles(),cur=P(),bi=base.filter(function(b){return b.id===cur.id})[0]||base[0];cur.w=bi.w;cur.u={};cur.x=bi.x;logEv('Profil zurückgesetzt: '+cur.name);break;
    case 'addfeat':var nm=$('#nf_name').value.trim(),vs=$('#nf_vals').value.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){var q=l.split('|');return {k:'v'+i,l:q[0],u:num(q[1])==null?50:num(q[1])}});
      if(!nm||vs.length<2){toast('Name und mindestens 2 Ausprägungen nötig');return}
      S.custom.push({id:uid('x_'),name:nm,grp:$('#nf_grp').value,w:+$('#nf_w').value||0,vals:vs});logEv('Eigenes Merkmal: '+nm);toast('Merkmal angelegt');break;
    case 'dcust':S.custom=S.custom.filter(function(c){return c.id!==v});break;
    case 'cpjson':copyTxt(JSON.stringify(S),'JSON kopiert');return;
    case 'dl':download();return;
    case 'impall':try{var j=JSON.parse($('#impall').value);if(!j.trips)throw new Error('Feld trips fehlt');S=j;save();logEv('Gesamt-JSON übernommen');toast('Übernommen')}catch(e){toast('JSON nicht lesbar: '+e.message);return}break;
    case 'reset':S.rst=true;break;
    case 'reset2':try{localStorage.removeItem(LS)}catch(e){}load();toast('Auslieferungsstand geladen');break;
    case 'tzsave':var tz={};$('#tzbox').value.split('\n').forEach(function(l){var q=l.split('=');if(q.length===2&&q[0].trim()){var x=q[1].trim();tz[q[0].trim().toUpperCase()]=x.toUpperCase()==='EU'?'EU':+x}});S.tz=tz;logEv('Zeitzonen gespeichert');toast('Gespeichert');break;
    case 'fb':var tx=$('#fbtx').value.trim();if(!tx)return;S.fb.unshift({t:nowIso(),x:tx});logEv('Feedback eingetragen');break;
  }
  save();render();
}
function download(){
  var emb=JSON.stringify(S).replace(/<\//g,'<\\/');
  var html=SRC.replace(/(<script type="application\/json" id="EMBEDDED_DATA">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+'\n'+emb+'\n'+b});
  try{var d=nowIso().replace('T','_').replace(':','');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='reise-entscheidungsfinder_'+d+'.html';document.body.appendChild(a);a.click();a.remove();toast('Download gestartet (in der Artefakt-Ansicht blockiert: JSON kopieren)')}catch(e){toast('Download nicht möglich: JSON kopieren')}
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||!$('#app').contains(el))return;act(el.getAttribute('data-a'),el)});
document.addEventListener('input',function(e){var el=e.target;if(el.hasAttribute&&el.hasAttribute('data-live')){var o=document.getElementById(el.getAttribute('data-live'));if(o)o.textContent=el.value}});
document.addEventListener('change',function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-b');if(!b)return;
  var r=setB(b,el.type==='checkbox'?el.checked:el.value,el);save();
  if(r==='r')render();
  else if(r&&r.indexOf('o:')===0){var q=r.split(':'),t=T(),l=t.legs.filter(function(x){return x.id===q[2]})[0],o=findOpt(t,q[2],q[1]),c=document.getElementById('oc-'+q[1]);if(c&&o){c.querySelector('.der').innerHTML=derStrip(o,l)}}
});
load();render();
})();
</script>
